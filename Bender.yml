package:
  name: friscv-tapeout
  authors:
    - "Emil Popovic"
    - "Matej Jurasic"

dependencies:
  axi:                { git: "https://github.com/pulp-platform/axi.git",                 version: 0.38.0 }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git",  version: 0.3.6  }
  apb:                { git: "https://github.com/pulp-platform/apb.git",                 version: 0.2.4  }
  apb_uart:           { git: "https://github.com/pulp-platform/apb_uart.git",            version: 0.2.1  }
  tech_cells_generic: { git: "https://github.com/pulp-platform/tech_cells_generic.git",  version: 0.2.11 }
  common_cells:       { git: "https://github.com/pulp-platform/common_cells.git",        version: 1.32.0 }

sources:
  # Core RTL files
  # Keep in compile order
  - rtl/core/friscv_pkg.sv
  - rtl/core/friscv_amo_unit.sv
  - rtl/core/friscv_core_complex.sv
  - rtl/core/friscv_core.sv
  - rtl/core/friscv_cpu_subsystem_core.sv
  - rtl/core/friscv_muldiv.sv
  - rtl/core/friscv_ex_stage_branch_unit.sv
  - rtl/core/friscv_ex_stage.sv
  - rtl/core/friscv_id_stage.sv
  - rtl/core/friscv_if_stage.sv
  - rtl/core/friscv_l1_arbiter.sv
  - rtl/core/friscv_l2_buffer.sv
  - rtl/core/friscv_l2_if.sv
  - rtl/core/friscv_mem_if.sv
  - rtl/core/friscv_mem_stage.sv
  - rtl/core/friscv_mmu.sv
  - rtl/core/friscv_pipeline_control.sv
  - rtl/core/friscv_pmp_check.sv
  - rtl/core/friscv_ptw.sv
  - rtl/core/friscv_tlb.sv
  - rtl/core/friscv_wb_stage.sv
  - rtl/core/friscv_zsbl_rom.sv

  # SoC RTL files
  - rtl/soc/friscv_axi4_full_adapter.sv
  - rtl/soc/friscv_clint.v
  - rtl/soc/friscv_sync.sv
  - rtl/soc/friscv_soc.sv
