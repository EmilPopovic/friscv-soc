package:
  name: friscv-tapeout
  authors:
    - "Emil Popović"
    - "Matej Jurasić"

dependencies:
  axi:                   { git: "https://github.com/pulp-platform/axi.git",                   version: 0.39.1 }
  register_interface:    { git: "https://github.com/pulp-platform/register_interface.git",    version: 0.3.9  }
  apb:                   { git: "https://github.com/pulp-platform/apb.git",                   version: 0.2.4  }
  apb_uart:              { git: "https://github.com/pulp-platform/apb_uart.git",              version: 0.2.1  }
  tech_cells_generic:    { git: "https://github.com/pulp-platform/tech_cells_generic.git",    version: 0.2.11 }
  common_cells:          { git: "https://github.com/pulp-platform/common_cells.git",          version: 1.32.0 }
  riscv-dbg:             { git: "https://github.com/pulp-platform/riscv-dbg.git",             version: 0.10.0 }
  opentitan_peripherals: { git: "https://github.com/pulp-platform/opentitan_peripherals.git", version: 0.4.0  }
  hyperbus:              { git: "https://github.com/pulp-platform/hyperbus.git",              version: 0.0.9  }

vendor_package:
  - name: rv_plic
    target_dir: "rtl/vendored/pulp_rv_plic"
    upstream:
      git: "https://github.com/pulp-platform/rv_plic.git"
      rev: "5b5c5a4c1c15c3d7bb833071d344b2c2bc5f599d"
    patch_dir: "rtl/vendored/patches/pulp_rv_plic"

sources:
  # Vendor RTL files
  - rtl/vendored/pulp_rv_plic/rtl/rv_plic_gateway.sv
  - rtl/vendored/pulp_rv_plic/rtl/rv_plic_target.sv
  - rtl/vendored/pulp_rv_plic/rtl/plic_regmap.sv
  - rtl/vendored/pulp_rv_plic/rtl/plic_top.sv

  # Core RTL files
  # Keep in compile order
  - rtl/core/friscv_pkg.sv
  - rtl/core/friscv_amo_unit.sv
  - rtl/core/friscv_core_complex.sv
  - rtl/core/friscv_core.sv
  - rtl/core/friscv_cpu_subsystem_core.sv
  - rtl/core/friscv_muldiv.sv
  - rtl/core/friscv_ex_stage_branch_unit.sv
  - rtl/core/friscv_ex_stage.sv
  - rtl/core/friscv_csr_file.sv
  - rtl/core/friscv_trap_controller.sv
  - rtl/core/friscv_id_regfile.sv
  - rtl/core/friscv_id_decoder.sv
  - rtl/core/friscv_id_stage.sv
  - rtl/core/friscv_if_stage.sv
  - rtl/core/friscv_l1_arbiter.sv
  - rtl/core/friscv_l2_buffer.sv
  - rtl/core/friscv_l2_if.sv
  - rtl/core/friscv_mem_if.sv
  - rtl/core/friscv_mem_stage.sv
  - rtl/core/friscv_mmu.sv
  - rtl/core/friscv_pipeline_control.sv
  - rtl/core/friscv_pmp_check.sv
  - rtl/core/friscv_ptw.sv
  - rtl/core/friscv_tlb.sv
  - rtl/core/friscv_wb_stage.sv
  - rtl/core/friscv_zsbl_rom.sv

  # SoC RTL files
  - rtl/soc/friscv_axi_lite_adapter.sv
  - rtl/soc/friscv_axi_lite_adapter_intf.sv
  - rtl/soc/friscv_dm_sba_mem.sv
  - rtl/soc/friscv_clint.v
  - rtl/soc/friscv_pinmux.sv
  - rtl/soc/friscv_mem_hub.sv
  - rtl/soc/friscv_soc.sv
