package:
  name: vernii
  description: "A minimal Linux-capable 32-bit RISC-V SoC built around FRISC-V"
  authors:
    - "Emil Popović <mail@emilpopovic.me>"
    - "Matej Jurasić <matej.jurasic@cappig.dev>"

dependencies:
  apb:                   { git: "https://github.com/pulp-platform/apb.git",                   version: 0.2.4  }
  apb_uart:              { git: "https://github.com/pulp-platform/apb_uart.git",              version: 0.2.3  }
  axi:                   { git: "https://github.com/pulp-platform/axi.git",                   version: 0.39.1 }
  common_cells:          { git: "https://github.com/pulp-platform/common_cells.git",          version: 1.40.0 }
  friscv-mem-utils:      { git: "https://github.com/EmilPopovic/friscv-mem-utils.git",        version: 3.0.0  }
  friscv-mem-if:         { git: "https://github.com/EmilPopovic/friscv-mem-if.git",           version: 0.1.0  }
  opentitan_peripherals: { git: "https://github.com/pulp-platform/opentitan_peripherals.git", version: 0.4.0  }
  register_interface:    { git: "https://github.com/pulp-platform/register_interface.git",    version: 0.3.9  }
  riscv-dbg:             { git: "https://github.com/pulp-platform/riscv-dbg.git",             version: 0.10.1 }
  riscv-frac-aclint:     { git: "https://github.com/EmilPopovic/riscv-frac-aclint.git",       version: 0.1.2  }
  tech_cells_generic:    { git: "https://github.com/pulp-platform/tech_cells_generic.git",    version: 0.2.14 }

vendor_package:
  - name: rv_plic
    target_dir: "rtl/vendored/pulp_rv_plic"
    upstream:
      git: "https://github.com/pulp-platform/rv_plic.git"
      rev: "5b5c5a4c1c15c3d7bb833071d344b2c2bc5f599d"
    patch_dir: "rtl/vendored/patches/pulp_rv_plic"
  - name: obi_uart
    target_dir: "rtl/vendored/pulp_obi_uart"
    upstream:
      git: "https://github.com/pulp-platform/obi_peripherals.git"
      rev: "079894a6cbd4e544c477643d184a4c340bd4e391"
    patch_dir: "rtl/vendored/patches/pulp_obi_uart"
    mapping:
      - {from: 'hw/obi_uart', to: 'rtl', patch_dir: 'rtl'}
  - name: spi_host
    target_dir: "rtl/vendored/opentitan_spi_host"
    upstream:
      git: "https://github.com/pulp-platform/opentitan_peripherals.git"
      rev: "cd3153de2783abd3d03d0595e6c4b32413c62f14"
    patch_dir: "rtl/vendored/patches/opentitan_spi_host"
    mapping:
      - {from: 'src/spi_host/rtl',  to: 'rtl', patch_dir: 'rtl'}
      - {from: 'src/spi_host/data', to: 'data'}

sources:
  # PULP PLIC
  - rtl/vendored/pulp_rv_plic/rtl/rv_plic_gateway.sv
  - rtl/vendored/pulp_rv_plic/rtl/rv_plic_target.sv
  - rtl/vendored/pulp_rv_plic/rtl/plic_regmap.sv
  - rtl/vendored/pulp_rv_plic/rtl/plic_top.sv
  # OpenTitan SPI host
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_reg_pkg.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_reg_top.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_byte_merge.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_byte_select.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_cmd_pkg.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_command_queue.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_fsm.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_window.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_data_fifos.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_shift_register.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host_core.sv
  - rtl/vendored/opentitan_spi_host/rtl/spi_host.sv
  # PULP OBI UART
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_pkg.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_baudgen.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_interrupts.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_modem.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_rx.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_tx.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart_register.sv
  - rtl/vendored/pulp_obi_uart/rtl/obi_uart.sv

  # Core RTL files
  # Keep in compile order
  - rtl/core/friscv_pkg.sv
  - rtl/core/friscv_amo_unit.sv
  - rtl/core/friscv_core_complex.sv
  - rtl/core/friscv_core.sv
  - rtl/core/friscv_cpu_subsystem_core.sv
  - rtl/core/friscv_muldiv.sv
  - rtl/core/friscv_ex_stage_branch_unit.sv
  - rtl/core/friscv_ex_stage.sv
  - rtl/core/friscv_csr_file.sv
  - rtl/core/friscv_trap_controller.sv
  - rtl/core/friscv_id_regfile.sv
  - rtl/core/friscv_id_decoder.sv
  - rtl/core/friscv_id_stage.sv
  - rtl/core/friscv_if_stage.sv
  - rtl/core/friscv_l1_arbiter.sv
  - rtl/core/friscv_mem_stage.sv
  - rtl/core/friscv_mmu.sv
  - rtl/core/friscv_pipeline_control.sv
  - rtl/core/friscv_pmp_check.sv
  - rtl/core/friscv_ptw.sv
  - rtl/core/friscv_tlb.sv
  - rtl/core/friscv_wb_stage.sv
  - rtl/core/friscv_zsbl_rom.sv

  # SoC RTL files
  - rtl/soc/vernii_pkg.sv
  - rtl/soc/vernii_zsbl_rom_pkg.sv  # generated by sw/boot/gen_zsbl_rom.py
  - rtl/soc/vernii_scb.sv
  - rtl/soc/vernii_soc.sv
