adapter driver remote_bitbang
remote_bitbang host 127.0.0.1
remote_bitbang port 9824

set CHIP friscv
jtag newtap $CHIP cpu -irlen 5 -expected-id 0x00000db3
target create $CHIP.cpu riscv -chain-position $CHIP.cpu

reset_config none
init
halt
