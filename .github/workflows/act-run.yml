name: riscv-arch-test

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  act-run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Restore test ELFs
        id: cache-elfs
        uses: actions/cache/restore@v5
        with:
          path: |
            verif/riscv-arch-test/elfs
            verif/riscv-arch-test/elfs-soc
          key: >-
            ${{ runner.os }}-act-elfs-${{
              hashFiles(
                'flake.nix',
                'flake.lock',
                'verif/riscv-arch-test/Makefile',
                'verif/riscv-arch-test/config/**',
                'verif/riscv-arch-test/scripts/copy_elfs.py'
              )
            }}

      - name: Checkout riscv-arch-test
        if: steps.cache-elfs.outputs.cache-hit != 'true'
        run: make -C verif/riscv-arch-test clone

      - name: Cache ACT tools
        if: steps.cache-elfs.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/uv
            ~/.cache/udb
          key: >-
            ${{ runner.os }}-act-tools-${{
              hashFiles(
                'verif/riscv-arch-test/riscv-arch-test/.mise.toml',
                'verif/riscv-arch-test/riscv-arch-test/uv.lock',
                'verif/riscv-arch-test/riscv-arch-test/framework/src/act/data/Gemfile.lock'
              )
            }}
          restore-keys: ${{ runner.os }}-act-tools-

      - name: Build test ELFs
        if: steps.cache-elfs.outputs.cache-hit != 'true'
        run: nix develop --accept-flake-config .#act --command make -C verif/riscv-arch-test all

      - name: Save test ELFs
        if: steps.cache-elfs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            verif/riscv-arch-test/elfs
            verif/riscv-arch-test/elfs-soc
          key: ${{ steps.cache-elfs.outputs.cache-primary-key }}

      - name: Run arch tests on core
        run: nix develop --accept-flake-config .#act --command make act-run-core

      - name: Run arch tests on SoC
        run: nix develop --accept-flake-config .#act --command make act-run-soc
